      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d93025;stop-opacity:1" />
    </linearGradient>

    <style>
      :root {
        --icon-color: #202124; 
      }
      @media (prefers-color-scheme: dark) {
